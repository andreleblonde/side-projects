<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Side Project Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .input-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            border: 1px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text);
        }

        input, select, textarea {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .generate-btn {
            width: 100%;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .output-section {
            display: none;
        }

        .output-section.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .output-header h2 {
            font-size: 1.5rem;
        }

        .export-btn {
            padding: 10px 20px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background: #059669;
        }

        .project-cards {
            display: grid;
            gap: 25px;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .project-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary);
        }

        .potential-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .potential-high {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .potential-medium {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .potential-low {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .project-pitch {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .project-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .meta-icon {
            width: 18px;
            height: 18px;
            opacity: 0.7;
        }

        .project-section {
            margin-bottom: 15px;
        }

        .project-section h4 {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .features-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .feature-tag {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .steps-list {
            counter-reset: step;
        }

        .step-item {
            position: relative;
            padding-left: 35px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .step-item::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            left: 0;
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .revenue-estimate {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.05));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .revenue-estimate h4 {
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .loading.visible {
            display: block;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .api-config {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .api-config h4 {
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .api-config input {
            font-family: monospace;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .project-header {
                flex-direction: column;
                gap: 10px;
            }

            .project-meta {
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 Side Project Generator</h1>
            <p class="subtitle">Turn your interests into profitable side hustles</p>
        </header>

        <div class="input-section">
            <div class="api-config">
                <h4>⚙️ API Configuration</h4>
                <div class="form-grid">
                    <div class="form-group">
                        <label>API URL</label>
                        <input type="text" id="apiUrl" value="https://api.minimax.chat/v1/text/chatcompletion_v2" placeholder="API URL">
                    </div>
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="password" id="apiKey" placeholder="Enter your API key">
                    </div>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>What are you interested in?</label>
                    <textarea id="interests" placeholder="e.g., AI, automation, e-commerce, content creation, fitness, photography..."></textarea>
                </div>
                <div class="form-group">
                    <label>What skills do you have?</label>
                    <textarea id="skills" placeholder="e.g., Python, marketing, writing, design, sales, programming..."></textarea>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Available hours per week</label>
                    <select id="hours">
                        <option value="5">5 hours/week</option>
                        <option value="10">10 hours/week</option>
                        <option value="15">15 hours/week</option>
                        <option value="20" selected>20 hours/week</option>
                        <option value="30">30 hours/week</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Budget range</label>
                    <select id="budget">
                        <option value="0">$0 (free only)</option>
                        <option value="50">Up to $50/month</option>
                        <option value="200" selected>Up to $200/month</option>
                        <option value="500">Up to $500/month</option>
                        <option value="1000">Up to $1000/month</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Experience level</label>
                    <select id="experience">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate" selected>Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
            </div>

            <button class="generate-btn" onclick="generateProjects()">
                ✨ Generate Project Ideas
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p class="loading-text">Analyzing your interests and generating ideas...</p>
        </div>

        <div class="output-section" id="outputSection">
            <div class="output-header">
                <h2>🎯 Your Project Ideas</h2>
                <button class="export-btn" onclick="exportProjects()">📥 Export to Markdown</button>
            </div>
            <div class="project-cards" id="projectCards"></div>
        </div>
    </div>

    <script>
        let generatedProjects = [];

        async function generateProjects() {
            const interests = document.getElementById('interests').value.trim();
            const skills = document.getElementById('skills').value.trim();
            const hours = document.getElementById('hours').value;
            const budget = document.getElementById('budget').value;
            const experience = document.getElementById('experience').value;
            const apiUrl = document.getElementById('apiUrl').value;
            const apiKey = document.getElementById('apiKey').value;

            if (!interests || !skills) {
                alert('Please fill in both interests and skills');
                return;
            }

            if (!apiKey) {
                alert('Please enter your API key');
                return;
            }

            const btn = document.querySelector('.generate-btn');
            btn.disabled = true;
            btn.textContent = 'Generating...';

            document.getElementById('loading').classList.add('visible');
            document.getElementById('outputSection').classList.remove('visible');

            const prompt = `Generate 3 side project ideas based on:

INTERESTS: ${interests}
SKILLS: ${skills}
AVAILABLE TIME: ${hours} hours/week
BUDGET: $${budget}/month
EXPERIENCE LEVEL: ${experience}

For each project, provide:
1. A catchy project name
2. A one-line pitch
3. Business potential (high/medium/low)
4. Time to MVP (in weeks)
5. Key features (3-5 bullet points)
6. Implementation steps (4-6 numbered steps)
7. Estimated revenue potential

Respond with ONLY valid JSON in this format:
{
  "projects": [
    {
      "name": "Project Name",
      "pitch": "One-line pitch",
      "potential": "high|medium|low",
      "mvpWeeks": 4,
      "features": ["feature1", "feature2", "feature3"],
      "steps": ["step1", "step2", "step3", "step4"],
      "revenue": "Brief revenue estimate"
    }
  ]
}`;

            try {
                // Use proxy to avoid CORS issues
                const response = await fetch('/api/minimax', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: apiUrl,
                        apiKey: apiKey,
                        requestBody: JSON.stringify({
                            model: 'abab6.5s-chat',
                            messages: [
                                {
                                    role: 'user',
                                    content: prompt
                                }
                            ],
                            temperature: 0.8,
                            max_tokens: 3000
                        })
                    })
                });

                const data = await response.json();
                
                let text = data.choices?.[0]?.message?.content || '';
                
                // Clean up markdown code blocks
                text = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                
                // Try to parse JSON
                let result;
                try {
                    result = JSON.parse(text);
                } catch {
                    // Try to extract JSON from text
                    const jsonMatch = text.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        result = JSON.parse(jsonMatch[0]);
                    } else {
                        throw new Error('Could not parse AI response');
                    }
                }

                generatedProjects = result.projects || [];
                renderProjects();

                // Save to file
                try {
                    await fetch('/save-projects', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            projects: generatedProjects,
                            context: { interests, skills, hours, budget, experience }
                        })
                    });
                } catch (e) {
                    console.log('Could not save to server, saving locally instead');
                    localStorage.setItem('lastGeneratedProjects', JSON.stringify({
                        projects: generatedProjects,
                        context: { interests, skills, hours, budget, experience }
                    }));
                }

            } catch (error) {
                alert('Error generating projects: ' + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ Generate Project Ideas';
                document.getElementById('loading').classList.remove('visible');
            }
        }

        function renderProjects() {
            const container = document.getElementById('projectCards');
            container.innerHTML = '';

            generatedProjects.forEach((project, index) => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.style.animationDelay = `${index * 0.1}s`;

                card.innerHTML = `
                    <div class="project-header">
                        <h3 class="project-name">${project.name}</h3>
                        <span class="potential-badge potential-${project.potential}">
                            ${project.potential.toUpperCase()} POTENTIAL
                        </span>
                    </div>
                    <p class="project-pitch">${project.pitch}</p>
                    
                    <div class="project-meta">
                        <div class="meta-item">
                            <span>⏱️ MVP: ${project.mvpWeeks} weeks</span>
                        </div>
                        <div class="meta-item">
                            <span>💰 Revenue: ${project.revenue}</span>
                        </div>
                    </div>

                    <div class="project-section">
                        <h4>Key Features</h4>
                        <div class="features-list">
                            ${project.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                        </div>
                    </div>

                    <div class="project-section">
                        <h4>Implementation Steps</h4>
                        <div class="steps-list">
                            ${project.steps.map(s => `<div class="step-item">${s}</div>`).join('')}
                        </div>
                    </div>

                    <div class="revenue-estimate">
                        <h4>💵 Revenue Potential</h4>
                        <p>${project.revenue}</p>
                    </div>
                `;

                container.appendChild(card);
            });

            document.getElementById('outputSection').classList.add('visible');
        }

        function exportProjects() {
            if (generatedProjects.length === 0) return;

            const interests = document.getElementById('interests').value;
            const skills = document.getElementById('skills').value;
            
            let markdown = `# Side Project Ideas\n\n`;
            markdown += `**Generated on:** ${new Date().toLocaleDateString()}\n\n`;
            markdown += `**Interests:** ${interests}\n`;
            markdown += `**Skills:** ${skills}\n\n`;
            markdown += `---\n\n`;

            generatedProjects.forEach((project, index) => {
                markdown += `## ${index + 1}. ${project.name}\n\n`;
                markdown += `**Pitch:** ${project.pitch}\n\n`;
                markdown += `**Potential:** ${project.potential.toUpperCase()}\n`;
                markdown += `**MVP Time:** ${project.mvpWeeks} weeks\n`;
                markdown += `**Revenue:** ${project.revenue}\n\n`;
                
                markdown += `### Features\n`;
                project.features.forEach(f => markdown += `- ${f}\n`);
                markdown += `\n`;
                
                markdown += `### Implementation Steps\n`;
                project.steps.forEach((s, i) => markdown += `${i + 1}. ${s}\n`);
                markdown += `\n---\n\n`;
            });

            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `side-projects-${new Date().toISOString().split('T')[0]}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Load saved API key if available
        if (localStorage.getItem('miniMaxApiKey')) {
            document.getElementById('apiKey').value = localStorage.getItem('miniMaxApiKey');
        }

        // Save API key on generate
        document.querySelector('.generate-btn').addEventListener('click', () => {
            const apiKey = document.getElementById('apiKey').value;
            if (apiKey) {
                localStorage.setItem('miniMaxApiKey', apiKey);
            }
        });
    </script>
</body>
</html>
